name: Stroku Native tests

on:
  push:
    branches: [main]
    paths:
      - "Stroku-Native/**"
      - ".github/workflows/stroku-native-tests.yml"
  pull_request:
    paths:
      - "Stroku-Native/**"
      - ".github/workflows/stroku-native-tests.yml"

permissions:
  contents: read

jobs:
  stroku-native-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Stroku-Native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Stroku-Native/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
